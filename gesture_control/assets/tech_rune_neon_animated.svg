<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc" class="tech-rune">
  <title id="title">Blue Neon Tech Rune</title>
  <desc id="desc">Animated vector HUD rune with rotating rings and interaction states.</desc>
  <defs>
    <filter id="glow-soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="2" result="blur2"/>
      <feMerge><feMergeNode in="blur1"/><feMergeNode in="blur2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#59d8ff" stop-opacity=".22"/>
      <stop offset="55%" stop-color="#1aa8ff" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#1aa8ff" stop-opacity="0"/>
    </radialGradient>
    <style><![CDATA[
      :root { --blue:#27b7ff; --blue2:#7ce8ff; }
      .tech-rune { overflow: visible; }
      .line,.line-thin{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
      .line{stroke:var(--blue);stroke-width:2}.line-thin{stroke:var(--blue2);stroke-width:1.15}
      .dim{opacity:.42}.bright{filter:url(#glow-soft)}.core{filter:url(#glow-strong)}
      .outer-ring{transform-origin:256px 256px;animation:spin-cw 12s linear infinite}
      .mid-ring{transform-origin:256px 256px;animation:spin-ccw 8s linear infinite}
      .inner-ring{transform-origin:256px 256px;animation:spin-cw 5s linear infinite}
      .rune{transform-origin:256px 256px;animation:rune-breathe 2.4s ease-in-out infinite}
      .orbit-dot{transform-origin:256px 256px;animation:spin-cw 4.2s linear infinite}
      .pulse-ring{fill:none;stroke:var(--blue2);stroke-width:2;opacity:0;transform-origin:256px 256px}

      /* State hooks: add these classes to root <svg> from the app */
      .tech-rune.is-active .outer-ring{animation-duration:6s}
      .tech-rune.is-active .mid-ring{animation-duration:4s}
      .tech-rune.is-active .rune{filter:url(#glow-strong)}
      .tech-rune.is-click .pulse-ring{animation:click-pulse .42s ease-out 1}
      .tech-rune.is-drag .outer-ring{animation-duration:2.8s}
      .tech-rune.is-drag .mid-ring{animation-duration:2.1s}
      .tech-rune.is-drag .rune{transform:scale(1.04);filter:url(#glow-strong)}
      .tech-rune.is-paused .outer-ring,.tech-rune.is-paused .mid-ring,.tech-rune.is-paused .inner-ring,.tech-rune.is-paused .orbit-dot,.tech-rune.is-paused .rune{animation-play-state:paused;opacity:.45}

      @keyframes spin-cw{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
      @keyframes spin-ccw{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
      @keyframes rune-breathe{0%,100%{opacity:.86;transform:scale(1)}50%{opacity:1;transform:scale(1.025)}}
      @keyframes click-pulse{0%{opacity:.95;transform:scale(.72)}100%{opacity:0;transform:scale(1.38)}}
      @media (prefers-reduced-motion:reduce){.outer-ring,.mid-ring,.inner-ring,.orbit-dot,.rune{animation:none!important}}
    ]]></style>
  </defs>

  <circle cx="256" cy="256" r="150" fill="url(#coreGlow)"/>

  <g class="outer-ring bright">
    <circle class="line dim" cx="256" cy="256" r="178" stroke-dasharray="86 16 34 20 64 18 18 22"/>
    <circle class="line-thin dim" cx="256" cy="256" r="190" stroke-dasharray="3 8"/>
    <g class="line-thin"><path d="M256 52V78"/><path d="M256 434V460"/><path d="M52 256H78"/><path d="M434 256H460"/></g>
    <g class="line-thin">
      <path d="M162 100l10-12 8 15 12-5"/><path d="M212 77l8 18 9-18"/><path d="M306 77l8 18 9-18"/><path d="M348 100l10-12 8 15 12-5"/>
      <path d="M413 154l-17 8 15 10"/><path d="M435 213l-18 7 12 11"/><path d="M435 299l-18-7 12-11"/><path d="M413 358l-17-8 15-10"/>
      <path d="M348 412l10 12 8-15 12 5"/><path d="M306 435l8-18 9 18"/><path d="M212 435l8-18 9 18"/><path d="M162 412l10 12 8-15 12 5"/>
      <path d="M99 358l17-8-15-10"/><path d="M77 299l18-7-12-11"/><path d="M77 213l18 7-12 11"/><path d="M99 154l17 8-15 10"/>
    </g>
  </g>

  <g class="mid-ring bright">
    <circle class="line" cx="256" cy="256" r="146" stroke-dasharray="42 14 9 11 26 18"/>
    <circle class="line-thin dim" cx="256" cy="256" r="132" stroke-dasharray="2 7"/>
    <g fill="none" stroke="#7ce8ff" stroke-width="1.4">
      <path d="M256 104l9 13-9 13-9-13z"/><path d="M408 256l-13 9-13-9 13-9z"/><path d="M256 408l9-13-9-13-9 13z"/><path d="M104 256l13 9 13-9-13-9z"/>
    </g>
  </g>

  <g class="inner-ring">
    <circle class="line-thin bright" cx="256" cy="256" r="108" stroke-dasharray="54 22 11 14"/>
    <circle class="line-thin dim" cx="256" cy="256" r="94"/>
    <g fill="#7ce8ff" filter="url(#glow-soft)"><circle cx="256" cy="148" r="3.3"/><circle cx="364" cy="256" r="3.3"/><circle cx="256" cy="364" r="3.3"/><circle cx="148" cy="256" r="3.3"/></g>
  </g>

  <g class="orbit-dot bright"><circle cx="256" cy="70" r="5" fill="#7ce8ff"/><path class="line-thin" d="M256 82A174 174 0 0 1 373 126"/></g>

  <g class="rune core">
    <path class="line" d="M256 178V334"/>
    <path class="line" d="M256 218L214 184"/><path class="line" d="M256 218L298 184"/>
    <path class="line-thin" d="M214 184V206L236 225"/><path class="line-thin" d="M298 184V206L276 225"/>
    <path class="line" d="M256 244L274 262 256 280 238 262Z"/>
    <path class="line-thin" d="M256 280L238 298V320"/><path class="line-thin" d="M256 280L274 298V320"/>
    <circle cx="256" cy="218" r="5.5" fill="none" stroke="#7ce8ff" stroke-width="1.6"/>
    <circle cx="256" cy="262" r="4" fill="#7ce8ff"/><circle cx="256" cy="334" r="4" fill="#7ce8ff"/>
    <path class="line-thin dim" d="M246 178H266"/><path class="line-thin dim" d="M246 334H266"/>
  </g>

  <circle class="pulse-ring bright" cx="256" cy="256" r="72"/>
  <g class="line-thin dim"><path d="M256 138V158"/><path d="M256 354V374"/><path d="M138 256H158"/><path d="M354 256H374"/></g>
</svg>
